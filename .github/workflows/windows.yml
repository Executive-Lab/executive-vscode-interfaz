# Lo que solo se puede probar en Windows, en una máquina Windows de GitHub, y el
# instalador de macOS, en una macOS.
#
# Windows es donde están casi todos los alumnos, y desde el Mac en el que se
# hace la barra no se puede probar: el relevo de Node en Git Bash y en
# PowerShell, qué Python se elige, la barra en un VS Code de Windows y el
# instalador. Y el de macOS se prueba mejor en una máquina limpia que en la de
# quien lo hace. Para un repositorio público, estas máquinas no cuestan nada.
name: Windows

on:
  push:
    paths:
      - 'extension/**'
      - 'skills/**'
      - 'instalador/comun/**'
      - 'instalador/windows/**'
      - 'instalador/mac/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lo de solo Windows, la batería de siempre y el contrato.
  windows:
    runs-on: windows-latest
    steps:
      # git en Windows cambia los saltos de línea al sacar el código, y aquí hay
      # copias que tienen que ser iguales byte a byte (la del freno) y ficheros que
      # las pruebas leen como texto. La barra viaja en el .vsix, que se hace en un
      # Mac: esto es solo para la copia de trabajo de la prueba.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      # El Node que lleva el instalador es el 24; el de VS Code, el de su Electron.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lo que solo se puede probar en Windows
        run: node extension/prueba/windows.js

      # El arnés de dentro no se versiona: se trae exacto, del package-lock.
      - name: El arnés de dentro y los módulos comunes
        run: |
          npm ci --prefix extension/media/harness --no-audit --no-fund
          node extension/preparar-paquete.js

      - name: La batería de siempre
        run: node extension/prueba/humo.js

      - name: Los mapeos de Codex
        run: node extension/prueba/mapeos-codex.js

      - name: El contrato con el arnés
        run: node extension/prueba/contrato.js

  # La barra en un VS Code de Windows de verdad: los comandos, los ajustes y el
  # relevo con el binario del editor, sin ningún node en el PATH.
  vscode-de-verdad:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: El arnés de dentro y los módulos comunes
        run: |
          npm ci --prefix extension/media/harness --no-audit --no-fund
          node extension/preparar-paquete.js
      - name: La barra en un VS Code de verdad
        working-directory: extension
        run: npm run probar-en-vscode

  # Y el instalador de macOS, en una máquina macOS: se construye el .dmg, se instala
  # en una carpeta personal de mentira, como en COMO-PROBARLO.md, y se comprueba con
  # probar.sh. Sin certificado, la firma se anota y no se mira.
  el-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: El arnés de dentro y los módulos comunes
        run: |
          npm ci --prefix extension/media/harness --no-audit --no-fund
          node extension/preparar-paquete.js
      - name: Construir el .dmg
        run: bash instalador/mac/construir.sh
      - name: Instalarlo en una carpeta personal de mentira
        run: |
          mkdir -p "$RUNNER_TEMP/casa-falsa/Documents"
          HOME="$RUNNER_TEMP/casa-falsa" node "instalador/mac/escenario/Instalar Executive Lab.app/Contents/Resources/instalar.js" --progreso "$RUNNER_TEMP/progreso.txt" --sin-dock --asistente losDos
      - name: Comprobarlo
        run: bash instalador/mac/probar.sh --casa "$RUNNER_TEMP/casa-falsa" --sin-firma --asistente losDos
      - name: El informe y el registro de la instalación
        if: always()
        run: cp "${TMPDIR:-/tmp}/executive-lab-instalacion.log" instalador/mac/ 2>/dev/null || true
      - name: Subirlos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-dmg-informe
          path: |
            instalador/mac/informe-*.txt
            instalador/mac/executive-lab-instalacion.log
          if-no-files-found: warn
      # Y el .dmg mismo, para probarlo a mano en un Mac (sin firmar: Gatekeeper pide
      # «Abrir igualmente» en Ajustes › Privacidad y seguridad).
      - name: Subir el .dmg
        uses: actions/upload-artifact@v4
        with:
          name: el-dmg
          path: instalador/mac/Executive Lab *.dmg
          retention-days: 14
          if-no-files-found: error

  # El .exe: se compila, se instala en silencio y se comprueba con probar.ps1,
  # como en un Windows limpio. Lo que esto no responde está en COMO-PROBARLO.md:
  # SmartScreen y un usuario sin administrador.
  el-exe:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: El arnés de dentro y los módulos comunes
        run: |
          npm ci --prefix extension/media/harness --no-audit --no-fund
          node extension/preparar-paquete.js

      # El Node portable que viaja en el .exe: el mismo que lleva el de macOS.
      - name: El Node portable de la carga
        shell: pwsh
        run: |
          $v = (Select-String -Path instalador/mac/construir.sh -Pattern 'NODE_VERSION="(v[\d.]+)"').Matches[0].Groups[1].Value
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-portable
          New-Item -ItemType Directory -Force instalador/windows/carga | Out-Null
          Move-Item "node-portable/node-$v-win-x64" instalador/windows/carga/runtime
          Write-Host "Node $v en la carga"

      - name: La carga
        shell: bash
        run: bash instalador/windows/preparar-carga.sh

      - name: Compilar el .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc instalador/windows/ExecutiveLab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno no ha compilado" }

      # Como lo haría quien lo prueba a mano: con el PowerShell de Windows.
      - name: Instalarlo en silencio y comprobarlo
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File instalador/windows/probar.ps1
          if ($LASTEXITCODE -ne 0) { throw "probar.ps1 ha encontrado algo mal" }

      # El registro vive en C:, y el código en D:: la acción de subir necesita una
      # carpeta común, así que se copia antes.
      - name: El registro de la instalación, junto al informe
        if: always()
        shell: pwsh
        run: |
          $registro = Join-Path $env:LOCALAPPDATA 'ExecutiveLab\instalacion.log'
          if (Test-Path $registro) { Copy-Item $registro instalador/windows/instalacion.log }
      - name: El informe y el registro de la instalación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-exe-informe
          path: |
            instalador/windows/informe-*.txt
            instalador/windows/instalacion.log
          if-no-files-found: warn
      # Y el .exe mismo, para probarlo a mano en un Windows de verdad (sin firmar:
      # SmartScreen pide «Más información» › «Ejecutar de todas formas»).
      - name: Subir el .exe
        uses: actions/upload-artifact@v4
        with:
          name: el-exe
          path: instalador/windows/Output/ExecutiveLab-Setup.exe
          retention-days: 14
          if-no-files-found: error
